# Local databases for development — start with:  npm run db:up   (or: docker compose up -d)
# Data survives restarts thanks to the named volumes at the bottom.
services:
  mongo:
    image: mongo:7
    container_name: careerpilot-mongo
    ports:
      - "27017:27017"          # host:container — server connects to mongodb://localhost:27017
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: careerpilot-qdrant
    ports:
      - "6333:6333"            # REST API — server connects to http://localhost:6333
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
